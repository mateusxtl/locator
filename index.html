<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema em Manutenção</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0f172a; 
            --blue: #3b82f6; 
            --purple: #8b5cf6;
            --text: #f8fafc; 
            --text-dim: #94a3b8;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }
        
        .container { text-align: center; padding: 20px; animation: fadeIn 0.8s ease; }
        
        /* O ícone bonito que você curtiu */
        .icon-box { 
            background: linear-gradient(135deg, var(--blue), var(--purple)); 
            width: 100px; 
            height: 100px; 
            border-radius: 25px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3rem; 
            margin: 0 auto 30px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            position: relative;
        }

        /* Efeito de pulso para parecer que o sistema está "vivo" */
        .icon-box::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 25px;
            border: 2px solid var(--blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2rem; margin-bottom: 10px; letter-spacing: -1px; }
        p { color: var(--text-dim); font-size: 1.1rem; max-width: 400px; margin: 0 auto 30px; line-height: 1.6; }

        .badge-manutencao {
            background: rgba(59, 130, 246, 0.1);
            color: var(--blue);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .loader {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .dot { width: 8px; height: 8px; background: var(--blue); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-snowflake" style="color:white"></i>
        </div>

        <span class="badge-manutencao">Atualização em andamento</span>
        <h1>Sistema Network</h1>
        <p>Estamos realizando melhorias nos bancos de dados e no localizador de rotas. Voltamos em alguns minutos!</p>

        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
